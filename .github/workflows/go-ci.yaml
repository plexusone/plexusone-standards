name: Go CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths:
      - 'resourceref/**.go'
      - 'resourceref/go.mod'
      - 'resourceref/go.sum'
      - '.github/workflows/go-ci.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'resourceref/**.go'
      - 'resourceref/go.mod'
      - 'resourceref/go.sum'
      - '.github/workflows/go-ci.yaml'
  workflow_dispatch:

jobs:
  ci:
    uses: plexusone/.github/.github/workflows/go-ci.yaml@main
    with:
      modules: '["resourceref"]'
